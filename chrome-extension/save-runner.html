<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raw Image Save Worker</title>
  <style>
    body { margin: 0; padding: 24px; background: #101316; color: #e9f2f1; font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    .card { max-width: 820px; margin: 0 auto; background: #171c1f; border: 1px solid #293439; border-radius: 16px; padding: 20px; box-shadow: 0 16px 40px rgba(0,0,0,.28); }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .meta { color: #a8bdba; margin-bottom: 16px; }
    .status { white-space: pre-wrap; word-break: break-word; background: #0d1113; border: 1px solid #233034; border-radius: 12px; padding: 14px; min-height: 180px; font-family: Consolas, "SFMono-Regular", monospace; }
    .actions { margin-top: 14px; }
    button { border: none; border-radius: 999px; padding: 10px 16px; color: #fff; font: 700 14px/1 "Segoe UI", "Microsoft YaHei", sans-serif; cursor: pointer; background: linear-gradient(135deg,#0ea5a4,#0f766e); }
    button:disabled { opacity: .65; cursor: wait; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Save Worker</h1>
    <div class="meta" id="meta">Preparing job...</div>
    <div class="status" id="status">Starting...</div>
    <div class="actions"><button id="pick" hidden>Choose Folder And Continue</button></div>
  </div>
  <script src="save-runner.js"></script>
</body>
</html>
